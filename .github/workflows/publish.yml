name: Latest Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-source:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra performance --group build

      - name: Build source distribution
        run: uv build --sdist --no-build-isolation

      - name: Upload source artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-dist
          path: dist/*.tar.gz

  build-wheels-standard:
    name: Build standard pure Python wheel
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --extra performance --group build

      - name: Build standard wheel
        run: uv build --wheel --no-build-isolation

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-standard
          path: dist/*.whl

  build-wheels-mypyc:
    name: Build MyPyC wheels (${{ matrix.os }} py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Export hashed requirements from uv.lock
        run: python tools/scripts/export_hashed_requirements.py --all --output-dir .build-requirements

      - name: Pre-warm Windows Defender exclusions
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # Defender's real-time scan on the freshly-extracted nuget-cpython
          # python.exe blocks virtualenv discovery past its 10s timeout.
          # Keep mypyc's build root short enough for MSVC linker command lines.
          Remove-Item -Recurse -Force "C:\b" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "C:\b" | Out-Null
          Add-MpPreference -ExclusionPath "$env:LOCALAPPDATA\pypa\cibuildwheel" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:TEMP" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "C:\b" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE\wheelhouse" -ErrorAction SilentlyContinue
          Add-MpPreference -ExclusionProcess "python.exe" -ErrorAction SilentlyContinue

      - name: Install cibuildwheel
        run: python -m pip install --require-hashes -r .build-requirements/cli.txt

      - name: Build wheels with cibuildwheel
        run: python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_BUILD: "cp${{ matrix.python-version == '3.11' && '311' || matrix.python-version == '3.12' && '312' || matrix.python-version == '3.13' && '313' || matrix.python-version == '3.14' && '314' || matrix.python-version == '3.15' && '315' }}-*"
          CIBW_BUILD_VERBOSITY: 1
          CIBW_BUILD_FRONTEND: "pip; args: --no-build-isolation"

          # Native host arch only — Linux aarch64 builds on ubuntu-24.04-arm,
          # macOS arm64 on macos-latest (Apple Silicon). No QEMU emulation.
          CIBW_ARCHS_LINUX: ${{ matrix.os == 'ubuntu-24.04-arm' && 'aarch64' || 'x86_64' }}
          CIBW_ARCHS_MACOS: "arm64"
          CIBW_ARCHS_WINDOWS: "AMD64"

          CIBW_SKIP: "*-musllinux*"

          CIBW_BEFORE_BUILD: 'pip install --require-hashes -r "{project}/.build-requirements/build.txt"'

          CIBW_BEFORE_TEST: 'pip install --require-hashes -r "{project}/.build-requirements/runtime.txt" -r "{project}/.build-requirements/test.txt"'
          CIBW_TEST_COMMAND: 'python "{project}/tools/scripts/mypyc_smoke.py" --require-compiled'

          # ── Linux (GCC): PGO three-stage build ──
          # Stage 1 (instrumented build) + Stage 2 (training) run in BEFORE_BUILD.
          # Stage 3 (optimized build) is the main cibuildwheel build with -fprofile-use.
          # HATCH_MYPYC_BUILD_DIR pins the build directory so profile data paths match.
          CIBW_BEFORE_BUILD_LINUX: >-
            pip install --require-hashes -r "{project}/.build-requirements/build.txt" &&
            PGO_DIR=/tmp/sqlspec-pgo &&
            BUILD_DIR=/tmp/sqlspec-mypyc-build &&
            mkdir -p "$PGO_DIR" "$BUILD_DIR" &&
            CFLAGS="-DNDEBUG -fno-strict-overflow -fno-semantic-interposition -fprofile-generate=$PGO_DIR"
            LDFLAGS="-Wl,-Bsymbolic-functions"
            HATCH_BUILD_HOOKS_ENABLE=1
            HATCH_MYPYC_BUILD_DIR="$BUILD_DIR"
            pip install --no-build-isolation --no-deps "{package}" &&
            pip install --require-hashes -r "{project}/.build-requirements/pgo.txt" &&
            PYTHONSAFEPATH=1 python "{project}/tools/scripts/pgo_training.py" --strict &&
            pip uninstall -y sqlspec &&
            rm -rf "$BUILD_DIR/build" "$BUILD_DIR/tmp"

          CIBW_ENVIRONMENT_LINUX: >-
            HATCH_BUILD_HOOKS_ENABLE=1
            HATCH_MYPYC_BUILD_DIR=/tmp/sqlspec-mypyc-build
            CFLAGS="-DNDEBUG -fno-strict-overflow -fno-semantic-interposition -flto=auto -fprofile-use=/tmp/sqlspec-pgo -fprofile-correction -Wno-error=missing-profile -Wno-error=coverage-mismatch"
            LDFLAGS="-Wl,-Bsymbolic-functions -flto=auto"

          # ── macOS (Clang): plain mypyc, no PGO ──
          CIBW_ENVIRONMENT_MACOS: >-
            HATCH_BUILD_HOOKS_ENABLE=1

          # ── Windows (MSVC): plain mypyc, no PGO ──
          CIBW_ENVIRONMENT_WINDOWS: >-
            HATCH_BUILD_HOOKS_ENABLE=1
            HATCH_MYPYC_BUILD_DIR=C:/b

      - name: Upload wheel artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-mypyc-${{ matrix.os }}-py${{ matrix.python-version }}
          path: wheelhouse/*.whl

  test-wheels:
    name: Test ${{ matrix.os }} py${{ matrix.python-version }}
    needs: [build-wheels-standard, build-wheels-mypyc]
    continue-on-error: ${{ matrix.python-version == '3.15' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Route untrusted release tag through an env var (not direct ${{ … }}
      # interpolation into the shell) to avoid command injection. Fall back
      # to pyproject.toml when triggered via workflow_dispatch (no release
      # context) so manual reruns still have a version to assert against.
      - name: Resolve expected version
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${RELEASE_TAG#v}"
          if [ -z "$tag" ]; then
            tag=$(grep -m1 '^version = ' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          fi
          echo "SQLSPEC_EXPECTED_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv python install "$PYTHON_VERSION"

      - name: Export hashed requirements from uv.lock
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: uv run --no-project --python "$PYTHON_VERSION" python tools/scripts/export_hashed_requirements.py --profile runtime --profile smoke --profile drivers --profile drivers-db2 --profile drivers-sqlanywhere --profile drivers-sqlanywhere-build --output-dir .build-requirements

      - name: Download standard wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheels-standard
          path: dist-standard/

      - name: Download mypyc wheel artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-mypyc-*
          merge-multiple: true
          path: dist-mypyc/

      # Install sqlspec from local wheels only (--no-index + --no-deps) so any
      # missing host wheel fails loudly instead of silently grabbing a stale
      # PyPI release. Core and smoke dependencies use hash-pinned requirements.
      # The version assert catches drift between pyproject.toml and the wheel.
      # Linux also installs the hash-pinned driver SDK profiles so the smoke run
      # imports those compiled adapter drivers instead of skipping them. sqlanydb
      # ships only as a source distribution, so it builds with a hash-pinned
      # backend; ibm_db ships Linux wheels for x86_64 only.
      - name: Test standard wheel installation
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv test-standard --python "$PYTHON_VERSION"
          uv pip install --no-config --python test-standard --no-index --no-deps --find-links dist-standard/ "sqlspec==${SQLSPEC_EXPECTED_VERSION}"
          uv pip install --no-config --python test-standard --require-hashes -r .build-requirements/runtime.txt
          uv run --no-project --python test-standard python -I -c "import sqlspec, os, sys; v=sqlspec.__version__; e=os.environ['SQLSPEC_EXPECTED_VERSION']; sys.exit(0 if v == e else (sys.stderr.write(f'version mismatch: got {v}, expected {e}\n') or 1))"
          uv run --no-project --python test-standard python -I -c "import sqlspec; print('Standard wheel OK')"

      - name: Test mypyc wheel installation
        shell: bash
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          uv venv test-mypyc --python "$PYTHON_VERSION"
          uv pip install --no-config --python test-mypyc --no-index --no-deps --find-links dist-mypyc/ "sqlspec==${SQLSPEC_EXPECTED_VERSION}"
          uv pip install --no-config --python test-mypyc --require-hashes -r .build-requirements/runtime.txt
          uv run --no-project --python test-mypyc python -I -c "import sqlspec, os, sys; v=sqlspec.__version__; e=os.environ['SQLSPEC_EXPECTED_VERSION']; sys.exit(0 if v == e else (sys.stderr.write(f'version mismatch: got {v}, expected {e}\n') or 1))"
          grep -v '^[[:space:]]*--hash=' .build-requirements/smoke.txt | sed -e 's/[[:space:]]*\\$//' > .build-requirements/smoke-specs.txt
          if uv pip install --no-config --python test-mypyc --dry-run --only-binary :all: -r .build-requirements/smoke-specs.txt; then
            uv pip install --no-config --python test-mypyc --require-hashes --only-binary :all: -r .build-requirements/smoke.txt
          else
            echo "::warning::obstore or pyarrow binary wheel unavailable for Python ${PYTHON_VERSION}; the obstore smoke check will be skipped"
          fi
          smoke_args=(--require-compiled)
          if [ "$RUNNER_OS" = "Linux" ]; then
            uv pip install --no-config --python test-mypyc --require-hashes --only-binary :all: -r .build-requirements/drivers.txt
            uv pip install --no-config --python test-mypyc --require-hashes --build-constraints .build-requirements/drivers-sqlanywhere-build.txt -r .build-requirements/drivers-sqlanywhere.txt
            smoke_args+=(--require-sdk-profile)
            if [ "$RUNNER_ARCH" = "X64" ]; then
              grep -v '^[[:space:]]*--hash=' .build-requirements/drivers-db2.txt | sed -e 's/[[:space:]]*\\$//' > .build-requirements/drivers-db2-specs.txt
              if uv pip install --no-config --python test-mypyc --dry-run --only-binary :all: -r .build-requirements/drivers-db2-specs.txt; then
                uv pip install --no-config --python test-mypyc --require-hashes --only-binary :all: -r .build-requirements/drivers-db2.txt
                smoke_args+=(--require-sdk ibm_db --require-sdk ibm_db_dbi)
              else
                echo "::warning::ibm_db binary wheel unavailable for Python ${PYTHON_VERSION}; the Db2 driver smoke check will be skipped"
              fi
            fi
          fi
          uv run --no-project --python test-mypyc python -I tools/scripts/mypyc_smoke.py "${smoke_args[@]}"

  publish-release:
    name: Publish to PyPI
    needs: [build-source, build-wheels-standard, build-wheels-mypyc, test-wheels]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/sqlspec/

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "*"
          merge-multiple: true
          path: dist/

      - name: List all built packages
        run: |
          echo "=== All built packages ==="
          find dist/ -name "*.whl" -o -name "*.tar.gz" | sort
          echo "=== Package count ==="
          find dist/ -name "*.whl" | wc -l
          find dist/ -name "*.tar.gz" | wc -l

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        # Pre-release versions (alpha, beta, rc) are automatically detected by PyPI
        # based on PEP 440 version format (e.g., 0.33.0a1, 0.33.0b1, 0.33.0rc1)
        with:
          packages-dir: dist/
          verbose: true
          print-hash: true
