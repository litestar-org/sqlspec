  [data-md-color-scheme="slate"] .sqlspec-playground__console {

  @media (max-width: 700px) {

<section class="sqlspec-playground" id="sqlspec-playground-main">

        <option value="typed">Typed Dataclass Rows</option>
        <option value="builder">SQL Query Builder</option>
        <option value="named">Named SQL Statements</option>
        <option value="pagination">Batch Insert &amp; Pagination</option>
      </select>
    </div>

    <div class="sqlspec-playground__actions">
      <span class="sqlspec-playground__inline-status" data-inline-status>Initializing...</span>
      <button type="button" class="sqlspec-playground__button" data-copy-python>Copy</button>
      <button type="button" class="sqlspec-playground__button" data-reset-python>Reset</button>
      <button type="button" class="sqlspec-playground__button sqlspec-playground__button--primary" data-run-python>
        <span>Run</span>
        <span class="sqlspec-playground__kbd">Ctrl+Enter</span>
      </button>
    </div>
  </div>

  <div class="sqlspec-playground__workspace">
    <div class="sqlspec-playground__pane sqlspec-playground__pane--editor">
      <div class="sqlspec-playground__pane-header">
        <span class="sqlspec-playground__pane-title">main.py</span>
        <span class="sqlspec-playground__pane-subtitle">Python · SQLite :memory:</span>
      </div>
      <textarea data-python-editor aria-label="Python editor">from sqlspec import SQLSpec
from sqlspec.adapters.sqlite import SqliteConfig

spec = SQLSpec()
config = spec.add_config(
    SqliteConfig(connection_config={"database": ":memory:"})
)

with spec.provide_session(config) as session:
    session.execute_script("""
        CREATE TABLE projects (
            id INTEGER PRIMARY KEY,
            name TEXT, category TEXT, stars INTEGER
        );
        INSERT INTO projects (name, category, stars) VALUES
            ('Litestar', 'ASGI Framework', 6400),
            ('SQLSpec', 'SQL Execution', 420),
            ('Advanced Alchemy', 'ORM Toolkit', 510),
            ('Polyfactory', 'Test Factories', 890);
    """)
    rows = session.select(
        "SELECT id, name, category, stars FROM projects "
        "WHERE stars >= :min_stars ORDER BY stars DESC",
        min_stars=400,
    )

rows</textarea>
    </div>

    <div class="sqlspec-playground__pane">
      <div class="sqlspec-playground__pane-header">
        <span class="sqlspec-playground__pane-title">Results</span>
        <div class="sqlspec-playground__actions">
          <span data-row-count class="sqlspec-playground__meta-badge" hidden></span>
          <button type="button" class="sqlspec-playground__ghost-btn" data-clear-output>Clear</button>
        </div>
      </div>

      <div class="sqlspec-playground__results-body" data-output-container>
        <div data-empty-state class="sqlspec-playground__empty">
          <strong>Preparing Browser Runtime</strong>
          Loading Python WebAssembly (Pyodide) and installing <code>sqlspec</code>. Your query will run automatically once ready.
        </div>
        <div data-table-output class="sqlspec-playground__table-wrapper" hidden></div>
        <div data-output class="sqlspec-playground__console" tabindex="0" aria-live="polite" hidden></div>
        <div data-error-output class="sqlspec-playground__error" hidden></div>
      </div>
    </div>
  </div>
</section>

<script>
  (function() {
    const PRESETS = {
      quickstart: [
        'from sqlspec import SQLSpec',
        'from sqlspec.adapters.sqlite import SqliteConfig',
        '',
        'spec = SQLSpec()',
        'config = spec.add_config(',
        '    SqliteConfig(connection_config={"database": ":memory:"})',
        ')',
        '',
        'with spec.provide_session(config) as session:',
        '    session.execute_script("""',
        '        CREATE TABLE projects (',
        '            id INTEGER PRIMARY KEY,',
        '            name TEXT, category TEXT, stars INTEGER',
        '        );',
        '        INSERT INTO projects (name, category, stars) VALUES',
        "            ('Litestar', 'ASGI Framework', 6400),",
        "            ('SQLSpec', 'SQL Execution', 420),",
        "            ('Advanced Alchemy', 'ORM Toolkit', 510),",
        "            ('Polyfactory', 'Test Factories', 890);",
        '    """)',
        '    rows = session.select(',
        '        "SELECT id, name, category, stars FROM projects "',
        '        "WHERE stars >= :min_stars ORDER BY stars DESC",',
        '        min_stars=400,',
        '    )',
        '',
        'rows'
      ].join('\n'),
      typed: [
        'from dataclasses import dataclass',
        'from sqlspec import SQLSpec',
        'from sqlspec.adapters.sqlite import SqliteConfig',
        '',
        '',
        '@dataclass(frozen=True, slots=True)',
        'class ServiceMetric:',
        '    service: str',
        '    region: str',
        '    latency_ms: float',
        '',
        '',
        'spec = SQLSpec()',
        'config = spec.add_config(',
        '    SqliteConfig(connection_config={"database": ":memory:"})',
        ')',
        '',
        'with spec.provide_session(config) as session:',
        '    session.execute(',
        '        "CREATE TABLE metrics (service TEXT, region TEXT, latency_ms REAL)"',
        '    )',
        '    session.execute_many(',
        '        "INSERT INTO metrics (service, region, latency_ms) VALUES (?, ?, ?)",',
        '        [',
        '            ("auth-api", "us-east", 4.2),',
        '            ("billing-api", "eu-west", 7.8),',
        '            ("search-api", "us-east", 2.9),',
        '        ],',
        '    )',
        '    metrics = session.select(',
        '        "SELECT service, region, latency_ms FROM metrics ORDER BY latency_ms ASC",',
        '        schema_type=ServiceMetric,',
        '    )',
        '',
        'metrics'
      ].join('\n'),
      builder: [
        'from sqlspec import SQLSpec, sql',
        'from sqlspec.adapters.sqlite import SqliteConfig',
        '',
        'spec = SQLSpec()',
        'config = spec.add_config(',
        '    SqliteConfig(connection_config={"database": ":memory:"})',
        ')',
        '',
        'with spec.provide_session(config) as session:',
        '    session.execute(',
        '        "CREATE TABLE adapters ("',
        '        "id INTEGER PRIMARY KEY, name TEXT, family TEXT, async_ready INTEGER)"',
        '    )',
        '    session.execute_many(',
        '        "INSERT INTO adapters (name, family, async_ready) VALUES (?, ?, ?)",',
        '        [',
        '            ("asyncpg", "PostgreSQL", 1),',
        '            ("psycopg", "PostgreSQL", 1),',
        '            ("oracledb", "Oracle", 1),',
        '            ("duckdb", "Analytics", 0),',
        '        ],',
        '    )',
        '    query = (',
        '        sql.select("id", "name", "family")',
        '        .from_("adapters")',
        '        .where("async_ready = ?")',
        '        .order_by("id")',
        '    )',
        '    rows = session.execute(query, 1).all()',
        '',
        'rows'
      ].join('\n'),
      named: [
        'from sqlspec import SQLSpec',
        'from sqlspec.adapters.sqlite import SqliteConfig',
        '',
        'spec = SQLSpec()',
        'config = spec.add_config(',
        '    SqliteConfig(connection_config={"database": ":memory:"})',
        ')',
        'spec.add_named_sql(',
        '    "active_users_by_role",',
        '    "SELECT id, username, role FROM users "',
        '    "WHERE role = :role AND active = 1 ORDER BY username",',
        ')',
        '',
        'with spec.provide_session(config) as session:',
        '    session.execute(',
        '        "CREATE TABLE users ("',
        '        "id INTEGER PRIMARY KEY, username TEXT, role TEXT, active INTEGER)"',
        '    )',
        '    session.execute_many(',
        '        "INSERT INTO users (username, role, active) VALUES (?, ?, ?)",',
        '        [',
        '            ("ada", "maintainer", 1),',
        '            ("grace", "maintainer", 1),',
        '            ("linus", "contributor", 1),',
        '            ("alan", "maintainer", 0),',
        '        ],',
        '    )',
        '    maintainers = session.select(',
        '        spec.get_sql("active_users_by_role"), role="maintainer"',
        '    )',
        '',
        'maintainers'
      ].join('\n'),
      pagination: [
        'from sqlspec import SQL, SQLSpec',
        'from sqlspec.adapters.sqlite import SqliteConfig',
        '',
        'spec = SQLSpec()',
        'config = spec.add_config(',
        '    SqliteConfig(connection_config={"database": ":memory:"})',
        ')',
        '',
        'with spec.provide_session(config) as session:',
        '    session.execute(',
        '        "CREATE TABLE events (id INTEGER PRIMARY KEY, topic TEXT, status TEXT)"',
        '    )',
        '    session.execute_many(',
        '        "INSERT INTO events (topic, status) VALUES (?, ?)",',
        '        [(f"orders.created.{i}", "delivered") for i in range(1, 10)],',
        '    )',
        '    paged = SQL("SELECT id, topic, status FROM events ORDER BY id").paginate(',
        '        page=2, page_size=3',
        '    )',
        '    page_rows, total_count = session.select_with_total(paged)',
        '    print(f"Showing page 2 ({len(page_rows)} of {total_count} total events)")',
        '',
        'page_rows'
      ].join('\n')
    };

    const PYTHON_RUNNER_BOOTSTRAP = [
      'import ast',
      'import dataclasses',
      'import json',
      'import time',
      'from collections.abc import Mapping',
      'from sqlspec import SQL, SQLSpec, sql',
      'from sqlspec.adapters.sqlite import SqliteConfig',
      '',
      'def _sqlspec_normalize_row(item):',
      '    if isinstance(item, Mapping):',
      '        return dict(item)',
      '    if dataclasses.is_dataclass(item) and not isinstance(item, type):',
      '        return dataclasses.asdict(item)',
      '    if hasattr(item, "__struct_fields__"):',
      '        return {field: getattr(item, field) for field in item.__struct_fields__}',
      '    if hasattr(item, "model_dump"):',
      '        return item.model_dump()',
      '    return None',
      '',
      'async def _sqlspec_execute_snippet(source_code: str) -> str:',
      '    namespace = {"__name__": "__main__"}',
      '    tree = ast.parse(source_code, mode="exec")',
      '    last_expr = None',
      '    if tree.body and isinstance(tree.body[-1], ast.Expr):',
      '        last_stmt = tree.body.pop()',
      '        last_expr = ast.Expression(last_stmt.value)',
      '        ast.fix_missing_locations(last_expr)',
      '    started = time.perf_counter()',
      '    compiled_body = compile(tree, "<playground>", "exec")',
      '    exec(compiled_body, namespace, namespace)',
      '    value = eval(compile(last_expr, "<playground>", "eval"), namespace, namespace) if last_expr is not None else None',
      '    elapsed_ms = (time.perf_counter() - started) * 1000.0',
      '    if isinstance(value, (list, tuple)) and value:',
      '        converted = [_sqlspec_normalize_row(row) for row in value]',
      '        if all(row is not None for row in converted):',
      '            return json.dumps({"kind": "table", "rows": converted, "elapsed_ms": elapsed_ms}, default=str)',
      '    single = _sqlspec_normalize_row(value) if value is not None else None',
      '    if single is not None:',
      '        return json.dumps({"kind": "table", "rows": [single], "elapsed_ms": elapsed_ms}, default=str)',
      '    if value is None:',
      '        return json.dumps({"kind": "none", "elapsed_ms": elapsed_ms})',
      '    return json.dumps({"kind": "value", "value": repr(value), "elapsed_ms": elapsed_ms})'
    ].join('\n');

    const root = document.getElementById("sqlspec-playground-main");
    if (!root) return;

    const presetSelect = root.querySelector("[data-preset-select]");
    const outputEl = root.querySelector("[data-output]");
    const tableOutputEl = root.querySelector("[data-table-output]");
    const rowCountEl = root.querySelector("[data-row-count]");
    const errorOutputEl = root.querySelector("[data-error-output]");
    const emptyStateEl = root.querySelector("[data-empty-state]");
    const inlineStatusEl = root.querySelector("[data-inline-status]");
    const pythonTextarea = root.querySelector("[data-python-editor]");
    const runPythonButton = root.querySelector("[data-run-python]");
    const resetPythonButton = root.querySelector("[data-reset-python]");
    const copyPythonButton = root.querySelector("[data-copy-python]");
    const clearOutputButton = root.querySelector("[data-clear-output]");

    let pyodide = null;
    let currentData = null;
    let sortColumn = null;
    let sortDirection = "asc";
    let lastElapsedMs = null;

    const getEditorValue = () => (pythonEditor ? pythonEditor.getValue() : pythonTextarea.value);
    const setEditorValue = (code) => {
      if (pythonEditor) {
        pythonEditor.setValue(code);
      } else {
        pythonTextarea.value = code;
      }
    };

    let pythonEditor = null;
    if (typeof CodeMirror !== "undefined") {
      pythonEditor = CodeMirror.fromTextArea(pythonTextarea, {
        mode: "python",
        lineNumbers: true,
        indentUnit: 4,
        tabSize: 4,
        indentWithTabs: false,
        styleActiveLine: true,
        cursorBlinkRate: 530,
        extraKeys: {
          "Ctrl-Enter": () => { executeCurrentSnippet(); },
          "Cmd-Enter": () => { executeCurrentSnippet(); }
        }
      });
    }

    const setEmptyState = (title, message) => {
      if (!emptyStateEl) return;
      emptyStateEl.innerHTML = "";
      const heading = document.createElement("strong");
      heading.textContent = title;
      const body = document.createElement("span");
      body.textContent = message;
      emptyStateEl.appendChild(heading);
      emptyStateEl.appendChild(body);
      emptyStateEl.hidden = false;
    };

    const setInlineStatus = (text, type) => {
      if (!inlineStatusEl) return;
      inlineStatusEl.className = "sqlspec-playground__inline-status";
      while (inlineStatusEl.firstChild) inlineStatusEl.removeChild(inlineStatusEl.firstChild);
      if (type === "running") {
        const spinner = document.createElement("span");
        spinner.className = "sqlspec-playground__spinner";
        inlineStatusEl.appendChild(spinner);
        inlineStatusEl.appendChild(document.createTextNode(" " + text));
        inlineStatusEl.classList.add("sqlspec-playground__inline-status--running");
      } else if (type === "success") {
        inlineStatusEl.textContent = "\u2713 " + text;
        inlineStatusEl.classList.add("sqlspec-playground__inline-status--success");
      } else if (type === "error") {
        inlineStatusEl.textContent = "\u2717 " + text;
        inlineStatusEl.classList.add("sqlspec-playground__inline-status--error");
      } else {
        inlineStatusEl.textContent = text;
      }
    };

    const clearOutput = (showPlaceholder) => {
      outputEl.textContent = "";
      outputEl.hidden = true;
      while (tableOutputEl.firstChild) tableOutputEl.removeChild(tableOutputEl.firstChild);
      tableOutputEl.hidden = true;
      if (rowCountEl) {
        rowCountEl.textContent = "";
        rowCountEl.hidden = true;
      }
      errorOutputEl.textContent = "";
      errorOutputEl.hidden = true;
      currentData = null;
      sortColumn = null;
      lastElapsedMs = null;
      if (emptyStateEl) {
        if (showPlaceholder) {
          setEmptyState(
            "Ready to Execute",
            "Press Run or Ctrl+Enter to execute the Python snippet against in-memory SQLite."
          );
        } else {
          emptyStateEl.hidden = true;
        }
      }
    };

    const sortData = (data, column, direction) => {
      return [...data].sort((a, b) => {
        const aVal = a[column];
        const bVal = b[column];
        if (aVal === bVal) return 0;
        if (aVal == null) return 1;
        if (bVal == null) return -1;
        return (aVal < bVal ? -1 : 1) * (direction === "asc" ? 1 : -1);
      });
    };

    const updateMetaBadge = (rowCount, elapsedMs) => {
      if (!rowCountEl) return;
      const parts = [];
      if (typeof rowCount === "number") {
        parts.push(rowCount + " row" + (rowCount === 1 ? "" : "s"));
      }
      if (typeof elapsedMs === "number") {
        parts.push(elapsedMs.toFixed(1) + " ms");
      }
      if (parts.length > 0) {
        rowCountEl.textContent = parts.join(" · ");
        rowCountEl.hidden = false;
      } else {
        rowCountEl.hidden = true;
      }
    };

    const renderTable = (data, elapsedMs) => {
      if (!Array.isArray(data) || data.length === 0 || typeof data[0] !== "object") {
        return false;
      }
      currentData = data;
      if (typeof elapsedMs === "number") {
        lastElapsedMs = elapsedMs;
      }
      const displayData = sortColumn ? sortData(data, sortColumn, sortDirection) : data;
      const headers = Object.keys(data[0]);
      while (tableOutputEl.firstChild) tableOutputEl.removeChild(tableOutputEl.firstChild);

      const table = document.createElement("table");
      table.className = "sqlspec-playground__table";

      const thead = document.createElement("thead");
      const trHead = document.createElement("tr");
      headers.forEach((header) => {
        const th = document.createElement("th");
        th.textContent = header;
        const indicator = document.createElement("span");
        indicator.className = "sort-indicator";
        th.appendChild(indicator);
        if (header === sortColumn) {
          th.classList.add(sortDirection === "asc" ? "sorted-asc" : "sorted-desc");
        }
        th.addEventListener("click", () => {
          if (sortColumn === header) {
            sortDirection = sortDirection === "asc" ? "desc" : "asc";
          } else {
            sortColumn = header;
            sortDirection = "asc";
          }
          renderTable(currentData, lastElapsedMs);
        });
        trHead.appendChild(th);
      });
      thead.appendChild(trHead);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      displayData.forEach((row) => {
        const tr = document.createElement("tr");
        headers.forEach((header) => {
          const td = document.createElement("td");
          const val = row[header];
          td.textContent = val === null || val === undefined ? "null" : String(val);
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });
      table.appendChild(tbody);
      tableOutputEl.appendChild(table);
      tableOutputEl.hidden = false;
      updateMetaBadge(data.length, lastElapsedMs);
      return true;
    };

    const showError = (error) => {
      if (emptyStateEl) emptyStateEl.hidden = true;
      errorOutputEl.textContent = error;
      errorOutputEl.hidden = false;
    };

    async function executeCurrentSnippet() {
      if (!pyodide || runPythonButton.disabled) {
        return;
      }

      clearOutput(false);
      runPythonButton.disabled = true;
      setInlineStatus("Running...", "running");

      const stdoutBuffer = [];
      pyodide.setStdout({ batched: (line) => stdoutBuffer.push(line) });
      pyodide.setStderr({ batched: (line) => stdoutBuffer.push(line) });

      try {
        pyodide.globals.set("_sqlspec_user_code", getEditorValue());
        const rawJson = await pyodide.runPythonAsync("await _sqlspec_execute_snippet(_sqlspec_user_code)");
        const payload = JSON.parse(rawJson);
        const consoleText = stdoutBuffer.join("\n").trim();

        let hasVisibleOutput = false;
        if (payload.kind === "table" && renderTable(payload.rows, payload.elapsed_ms)) {
          hasVisibleOutput = true;
        } else if (payload.kind === "value") {
          updateMetaBadge(null, payload.elapsed_ms);
        } else {
          updateMetaBadge(null, payload.elapsed_ms);
        }

        if (consoleText || payload.kind === "value") {
          const lines = [];
          if (consoleText) lines.push(consoleText);
          if (payload.kind === "value") lines.push(payload.value);
          outputEl.textContent = lines.join("\n");
          outputEl.hidden = false;
          hasVisibleOutput = true;
        }

        if (!hasVisibleOutput) {
          setEmptyState(
            "Statement Executed",
            "Completed with no returned rows or console output."
          );
        }

        setInlineStatus("SQLite Ready", "success");
      } catch (err) {
        showError(String(err));
        setInlineStatus("Execution Error", "error");
      } finally {
        runPythonButton.disabled = false;
      }
    }

    const initializePlayground = async () => {
      if (typeof loadPyodide === "undefined") {
        setInlineStatus("Runtime Unavailable", "error");
        setEmptyState(
          "WebAssembly Runtime Unavailable",
          "Pyodide could not be loaded from jsDelivr CDN in this browser environment."
        );
        return;
      }
      try {
        setInlineStatus("Loading Pyodide...", "running");
        pyodide = await loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.29.0/full/"
        });

        setInlineStatus("Installing sqlspec...", "running");
        await pyodide.loadPackage(["sqlite3", "micropip"]);
        const micropip = pyodide.pyimport("micropip");
        await micropip.install("sqlspec");
        await pyodide.runPythonAsync(PYTHON_RUNNER_BOOTSTRAP);

        runPythonButton.disabled = false;
        setInlineStatus("SQLite Ready", "success");
        await executeCurrentSnippet();
      } catch (err) {
        setInlineStatus("Init Failed", "error");
        showError("Failed to initialize Python WebAssembly runtime:\n" + String(err));
      }
    };

    runPythonButton.disabled = true;

    runPythonButton.addEventListener("click", () => {
      executeCurrentSnippet();
    });

    if (presetSelect) {
      presetSelect.addEventListener("change", () => {
        const key = presetSelect.value;
        if (PRESETS[key]) {
          setEditorValue(PRESETS[key]);
          if (pyodide && !runPythonButton.disabled) {
            executeCurrentSnippet();
          } else {
            clearOutput(true);
          }
        }
      });
    }

    resetPythonButton.addEventListener("click", () => {
      const key = presetSelect ? presetSelect.value : "quickstart";
      setEditorValue(PRESETS[key] || PRESETS.quickstart);
      if (pyodide && !runPythonButton.disabled) {
        executeCurrentSnippet();
      } else {
        clearOutput(true);
      }
    });

    if (copyPythonButton) {
      copyPythonButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(getEditorValue());
          const original = copyPythonButton.textContent;
          copyPythonButton.textContent = "Copied";
          setTimeout(() => { copyPythonButton.textContent = original; }, 1400);
        } catch (_err) {
          copyPythonButton.textContent = "Copy failed";
        }
      });
    }

    clearOutputButton.addEventListener("click", () => {
      clearOutput(true);
    });

    initializePlayground();
  })();
</script>
