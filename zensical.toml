[project]
site_name = "SQLSpec"
site_description = "Typed SQL query execution, statement caching, migrations, Arrow streaming, and multi-adapter database access for Python."
site_url = "https://sqlspec.dev/"
repo_url = "https://github.com/litestar-org/sqlspec"
repo_name = "litestar-org/sqlspec"
docs_dir = "docs"
site_dir = "site"
use_directory_urls = true
exclude_docs = """
examples/
_static/
_templates/
_tapes/
__init__.py
conf.py
*.rst
"""
extra_css = ["stylesheets/extra.css"]
nav = [
  { "Home" = "index.md" },
  { "Playground" = "playground.md" },
]

[project.theme]
language = "en"
logo = "assets/logo.svg"
favicon = "assets/favicon.svg"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "indigo"
toggle = { icon = "lucide/sun", name = "Switch to dark mode" }

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "indigo"
toggle = { icon = "lucide/moon", name = "Switch to light mode" }

[project.plugins.search]

[project.plugins.redirects.redirect_maps]

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]
enable_inventory = true
inventories = [
  "https://docs.python.org/3/objects.inv",
  "https://typing-extensions.readthedocs.io/en/stable/objects.inv",
  "https://click.palletsprojects.com/en/stable/objects.inv",
  "https://anyio.readthedocs.io/en/stable/objects.inv",
  "https://docs.litestar.dev/latest/objects.inv",
  "https://fastapi.tiangolo.com/objects.inv",
  "https://flask.palletsprojects.com/en/stable/objects.inv",
  "https://sanic.readthedocs.io/en/latest/objects.inv",
  "https://dishka.readthedocs.io/en/latest/objects.inv",
  "https://msgspec.dev/objects.inv",
  "https://pydantic.dev/docs/validation/latest/objects.inv",
  "https://www.attrs.org/en/stable/objects.inv",
  "https://arrow.apache.org/docs/objects.inv",
  "https://arrow.apache.org/adbc/current/objects.inv",
  "https://docs.pola.rs/api/python/stable/objects.inv",
  "https://pandas.pydata.org/docs/objects.inv",
  "https://developmentseed.org/obstore/latest/objects.inv",
  "https://filesystem-spec.readthedocs.io/en/latest/objects.inv",
  "https://opentelemetry-python.readthedocs.io/en/latest/objects.inv",
  "https://www.psycopg.org/psycopg3/docs/objects.inv",
  "https://magicstack.github.io/asyncpg/current/objects.inv",
  "https://python-oracledb.readthedocs.io/en/latest/objects.inv",
  "https://googleapis.dev/python/bigquery/latest/objects.inv",
  "https://googleapis.dev/python/spanner/latest/objects.inv",
  "https://aiosqlite.omnilib.dev/en/stable/objects.inv",
  "https://pymysql.readthedocs.io/en/latest/objects.inv",
  "https://aiomysql.readthedocs.io/en/stable/objects.inv",
  "https://pymssql.readthedocs.io/en/stable/objects.inv",
]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
docstring_section_style = "table"
find_stubs_package = true
heading_level = 3
inherited_members = false
line_length = 80
members_order = "source"
merge_init_into_class = true
modernize_annotations = true
annotations_path = "brief"
preload_modules = ["sqlspec"]
separate_signature = true
show_bases = true
show_category_heading = false
show_if_no_docstring = true
show_object_full_path = false
show_root_full_path = false
show_root_heading = true
show_root_toc_entry = true
show_signature_annotations = true
show_source = true
show_symbol_type_heading = true
show_symbol_type_toc = false
signature_crossrefs = true
summary = true
unwrap_annotated = true
filters = ["!^_"]

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
"mkdocs-click" = {}
tables = {}
toc = { permalink = true, toc_depth = "2-3" }

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.snippets]
base_path = ["."]
check_paths = true
dedent_subsections = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
